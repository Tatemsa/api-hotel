spring.application.name=hotel

# Configuration JWT
app.jwt.secret=bXyAqLdseVtGzMkWpQjRnEuTbCvHxYzLbsdvnssdqhjdqqDVHDDJNVDSQVDVSDVvdvdvdvqvdsnvd
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

#Database configuration
spring.datasource.url=jdbc:mariadb://localhost:3306/api
spring.datasource.username=admin
spring.datasource.password=admin123
server.port=8080


# --- CONFIGURATION HIBERNATE (JPA) ---
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- SERVER CONFIGURATION
server.servlet.context-path=/api

# --- MAIL SERVER CONFIGURATION ---
spring.mail.host=localhost
spring.mail.port=9025

# Configuration Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Configuration pour l'authentification JWT
springdoc.swagger-ui.oauth.client-id=hotel-api
springdoc.swagger-ui.oauth.realm=hotel-management

# Log printing
logging.level.org.springdoc=DEBUG
logging.level.org.springframework.web=DEBUG